:root {

  --surface: #E8ECF8;
  --ink: #111A2E;

  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

  :root:not([data-theme="light"]) {
    --bg: #0D1120;
    --surface: #1A2140;
    --ink: #E9ECF7;
    --muted: #9AA4C2;
    --line: #263052;
    --accent: #8D9CFF;
    --hero: #2A3BC8;
    --danger: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1120;
  --surface: #1A2140;
  --ink: #E9ECF7;
  --muted: #9AA4C2;
  --line: #263052;
  --accent: #8D9CFF;
  --hero: #2A3BC8;
  --danger: #FF8A80;

}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 4.5rem); }
*, *::before, *::after { box-sizing: border-box; }
body {

  background: var(--bg);
  color: var(--ink);
  font-family: var(--text);
  font-size: 1.1rem;
  line-height: 1.9;

}
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 52rem; margin-inline: auto; padding-inline: 1.25rem; }
.narrow { max-width: 41rem; }

/* header */
.site-header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.brand { font-family: var(--display); font-weight: 700; font-size: 1.8rem; line-height: 1; }
.nav { display: flex; align-items: center; gap: 1.1rem; font-size: 1rem; }

.nav a:hover, .nav button:hover { color: var(--accent); }
.nav a.nav-write { color: var(--accent); font-weight: 700; }
.nav button { font: inherit; background: none; border: 0; padding: .25rem 0; cursor: pointer; }

.hero { background: var(--hero); color: #fff; padding: clamp(3rem, 10vw, 7rem) 0 clamp(3rem, 9vw, 6rem); }
.hero h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(2.7rem, 10vw, 5.8rem);
  line-height: 1.25;
  margin: 0 0 1.5rem;
  max-width: 13em;
}
.hero p { max-width: 31rem; margin: 0 0 2rem; font-size: 1.2rem; color: rgba(255,255,255,.9); }
.btn {

  background: #fff;
  color: var(--hero-ink);
  font-family: var(--display);
  font-weight: 500;
  font-size: 1.05rem;
  line-height: 1.4;
  padding: .7rem 1.5rem;
  border-radius: 8px;
  transition: background .15s;
}
.btn:hover { background: #E8ECF8; }

.btn-solid, .btn-line {
  display: inline-block;
  font-family: var(--display);
  font-weight: 500;
  font-size: 1.05rem;
  line-height: 1.4;
  border-radius: 8px;
  padding: .7rem 1.5rem;
  cursor: pointer;
  transition: filter .15s, border-color .15s;
}
.btn-solid { background: var(--hero); color: #fff; border: 1px solid var(--hero); }

  line-height: 1.5;

  background: transparent;
  border: 1px solid var(--line);

  padding: .3rem 1.1rem;

}

.search:focus { border-color: var(--accent); }

.row { display: block; padding: 1.75rem 0; border-bottom: 1px solid var(--line); }
.row-title {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.55rem;
  line-height: 1.5;

.meta { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1rem; font-size: .95rem; color: var(--muted); }
.tag { background: var(--surface); color: var(--ink); border-radius: 999px; padding: 0 .85rem; line-height: 1.7; }
.empty { padding: 2.5rem 0; color: var(--muted); }

.invite { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; padding-top: 2rem; }
.invite p { margin: 0; font-family: var(--display); font-weight: 500; font-size: 1.35rem; line-height: 1.5; }

/* article */
.post { padding-top: 2.5rem; padding-bottom: 3rem; }
.back { display: inline-block; color: var(--accent); font-size: 1rem; margin-bottom: 1.5rem; }
.back:hover { text-decoration: underline; }
.post h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(2rem, 7vw, 3.1rem);
  line-height: 1.4;
  margin: .75rem 0 2rem;
}
.post .body p { font-size: 1.22rem; line-height: 2.1; margin: 0 0 1.5rem; }
.notice { background: var(--surface); border-radius: 8px; padding: .75rem 1rem; margin: 0 0 1.5rem; font-size: 1rem; }
.owner { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin-top: 2rem; }
.owner p { margin: 0; color: var(--muted); }
.more { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
.more h2 { font-family: var(--display); font-size: 1.3rem; margin: 0; }
.more .row:last-child { border-bottom: 0; }

/* write form */
.write { padding-top: 2.5rem; padding-bottom: 3rem; }
.write h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.4; margin: .5rem 0 .75rem; }
.hint { color: var(--muted); margin: 0 0 1.75rem; font-size: 1rem; }
.field { display: block; margin-bottom: 1.25rem; }
.field-label { display: block; font-family: var(--display); font-weight: 500; font-size: 1.05rem; margin-bottom: .4rem; }
.input {

  font-size: 1.1rem;

  border: 1px solid transparent;

  padding: .65rem .9rem;
  width: 100%;
}
.input:focus { border-color: var(--accent); }
textarea.input { min-height: 18rem; line-height: 2; font-size: 1.15rem; resize: vertical; }
.note { display: block; color: var(--muted); font-size: .95rem; margin-top: .35rem; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-error { color: var(--danger); font-weight: 500; margin: 0 0 1rem; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }

/* about + footer */
.about { background: var(--surface); padding: 3.5rem 0; }
.about h2 { font-family: var(--display); font-weight: 700; font-size: 1.8rem; margin: 0 0 1rem; scroll-margin-top: 5rem; }
.about p { max-width: 36rem; margin: 0 0 1rem; }
footer { padding: 2rem 0; color: var(--muted); font-size: .95rem; }
footer .wrap { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
footer a:hover { color: var(--accent); }

@media (max-width: 34rem) {

  .search { max-width: none; }
  .pair { grid-template-columns: 1fr; gap: 0; }
}
@media (prefers-reduced-motion: reduce) {

[hidden] { display: none !important; }

<script type="application/json" id="posts-data">[{"id":"pmub93wso","cat":"كتابة","date":"2026-09-21","title":"حرب","author":"رضا","excerpt":"صعدنه التل نصيح حسين يحسين ‏ولگينه على تراب الحار خدك ‏ ‏ ‏ ‏ماي انتَ تطشر فوك الرمال ‏عطاشه نضل يبو السجاد بعدك","body":["صعدنه التل نصيح حسين يحسين ‏ولگينه على تراب الحار خدك ‏ ‏ ‏ ‏ماي انتَ تطشر فوك الرمال ‏عطاشه نضل يبو السجاد بعدك"]},{"id":"pmub81i58","cat":"كتابة","date":"2026-09-21","title":"دمع","author":"رضا","excerpt":"صعدنه التل نصيح حسين يحسين ‏ولگينه على تراب الحار خدك ‏ ‏ماي انتَ تطشر فوك الرمال ‏عطاشه نضل يبو السجاد بعدك","body":["صعدنه التل نصيح حسين يحسين ‏ولگينه على تراب الحار خدك ‏ ‏ماي انتَ تطشر فوك الرمال ‏عطاشه نضل يبو السجاد بعدك"]},{"id":"first-sentence","cat":"كتابة","date":"2026-08-30","title":"لماذا تتعثر الجملة الأولى؟","excerpt":"الصفحة البيضاء لا تخيفنا لأنها فارغة، بل لأننا نطلب من أول جملة أن تفعل كل شيء.","body":["كل من كتب يعرف هذه اللحظة: الفكرة واضحة في الرأس، والصفحة مفتوحة أمامك، لكن الجملة الأولى ترفض أن تخرج. السبب في الغالب أننا نحمّلها أكثر مما تحتمل، فنريدها أن تعلن الموضوع وتشدّ القارئ وتُظهر أسلوبنا كله دفعة واحدة.","جرّب أن تكتب أسوأ جملة ممكنة. لا تهتم بالصياغة ولا بالترتيب، وضع على الصفحة أي شيء يمكنك تعديله لاحقًا. التعديل أسهل بكثير من الإبداع من فراغ، والمسودة الرديئة أنفع من الصفحة الفارغة.","وتذكّر أن القارئ لا يرى مسودتك الأولى أبدًا. ما يصله هو النسخة الأخيرة، وهي نتيجة جولات من الحذف والتبديل وإعادة الترتيب. لذلك ابدأ من أي نقطة، ثم عد إلى بداية النص حين تعرف أين انتهيت.","وإن بقيت عالقًا، اترك الجملة الأولى فارغة وانتقل إلى الفقرة التالية. كثيرًا ما تظهر الافتتاحية الجيدة بعد أن تنتهي من كتابة كل شيء آخر."]},{"id":"slow-reading","cat":"قراءة","date":"2026-08-14","title":"قراءة بطيئة في زمن السرعة","excerpt":"أن تقرأ صفحة واحدة بانتباه كامل خير من عشر صفحات تمرّ أمام عينيك.","body":["نقرأ اليوم كثيرًا ونتذكر قليلًا. تمرّ الشاشة أمامنا بعناوين وملخصات ومقاطع، ونظن أننا اطلعنا على الموضوع، بينما لم نمنح أي نص وقتًا كافيًا ليستقر في الذهن.","القراءة البطيئة لا تعني التباطؤ في كل شيء، بل اختيار نص واحد يستحق الانتباه ثم البقاء معه. توقف عند الجملة التي أعجبتك، وأعدها بصوت خافت، وسجّل في الهامش سبب توقفك.","ستلاحظ بعد أسابيع أن ما علق في ذاكرتك من كتبك هو الصفحات التي بقيت معها طويلًا، لا التي أنهيتها بسرعة لتضيفها إلى قائمة الكتب المقروءة."]},{"id":"editing","cat":"كتابة","date":"2026-07-22","title":"التحرير: أن تحذف ما تحب","excerpt":"أجمل عبارة في مسودتك قد تكون أول ما يجب حذفه، إن كانت لا تخدم النص.","body":["في كل مسودة عبارة تعتز بها لأنك تعبت في صياغتها، أو لأنها أجمل ما كتبت. وفي كثير من الأحيان تكون هذه العبارة نفسها هي التي تعطّل الفقرة.","اسأل عن كل جملة: ماذا يخسر القارئ لو حذفتها؟ إن كان الجواب لا شيء، فاحذفها دون تردد. يمكنك أن تحتفظ بها في ملف جانبي إن كان الفراق صعبًا، وستجد أنك نادرًا ما تعود إليه.","التحرير الجيد لا يجعل النص أقصر فحسب، بل يجعله أوضح. حين تُزال الزوائد يظهر ما أردت قوله فعلًا."]},{"id":"next-book","cat":"قراءة","date":"2026-07-05","title":"كيف تختار كتابك القادم؟","excerpt":"طريقة بسيطة تجنّبك قوائم الأكثر مبيعًا وتقرّبك من كتاب يناسبك فعلًا.","body":["أسهل طريقة لاختيار كتاب هي أن تسأل: ما السؤال الذي يشغلني هذه الأيام؟ قد يكون عن المدن، أو عن الذاكرة، أو عن طريقة عمل الأشياء. الكتب التي تجيب عن أسئلتك تُقرأ بشغف لا بواجب.","بعد ذلك انظر إلى مراجع الكتاب الذي أعجبك. المؤلفون الجيدون يذكرون من قرؤوا، وهكذا تصنع لنفسك خريطة قراءة شخصية لا تعتمد على ترشيحات الآخرين.","وأخيرًا، اقرأ أول عشر صفحات قبل أن تقرر. إن لم يشدك الكتاب فيها فلا بأس بتركه، فالوقت أثمن من أن نقضيه مع كتاب لا نحبه."]},{"id":"notebook","cat":"أفكار","date":"2026-06-18","title":"دفتر صغير في الجيب","excerpt":"الأفكار الجيدة تزورنا في أوقات غير مناسبة، ولا تنتظر أن نجد قلمًا.","body":["معظم أفكارنا تأتي ونحن في الطريق أو في الطابور أو على وشك النوم، ثم تختفي قبل أن نصل إلى مكتبنا. دفتر صغير في الجيب يحل هذه المشكلة بأبسط شكل.","لا تحاول أن تكتب جملًا كاملة. كلمتان أو ثلاث تكفيان لتعيدا إليك الفكرة كلها لاحقًا. والأهم أن تراجع الدفتر مرة كل أسبوع، فالملاحظة التي لا تُقرأ مرة ثانية تبقى مجرد أثر.","وبعد مدة سيتحول الدفتر إلى مخزن للمواضيع التي ستكتب عنها، وستجد أن الأفكار المتناثرة تتلاقى في خيط واحد لم تكن تراه."]},{"id":"boredom","cat":"أفكار","date":"2026-05-27","title":"الملل مساحة نحتاجها","excerpt":"حين نملأ كل لحظة فراغ بالهاتف، نفقد الوقت الذي كانت تنضج فيه أفكارنا.","body":["كان الانتظار قديمًا يعني أن نحدّق في الفراغ، وأن يذهب العقل إلى حيث يشاء. اليوم نملأ كل دقيقة فارغة بشاشة صغيرة، ولا نترك للعقل فرصة ليتجول.","الأفكار التي تحتاج إلى وقت لا تنضج تحت الضوء المستمر. تنضج في المشي الطويل، وفي غسل الأطباق، وفي النظر من نافذة القطار.","جرّب أن تترك الهاتف في جيبك في أول انتظار غدًا. لن يحدث شيء مثير، لكن قد تجد أن فكرة معلّقة منذ أسبوع وجدت أخيرًا مكانها."]}]</script>

      '</section>';
    window.scrollTo(0, 0);

    var fTitle = document.getElementById('f-title');
    var fCat = document.getElementById('f-cat');
    var fAuthor = document.getElementById('f-author');
    var fText = document.getElementById('f-text');
    var err = document.getElementById('err');
    var saveBtn = document.getElementById('save');

    if (editing) {
      fTitle.value = editing.title;
      if (writeCats.indexOf(editing.cat) !== -1) fCat.value = editing.cat;
      fAuthor.value = editing.author || '';
      fText.value = editing.body.join('\n\n');
    } else if (draft && typeof draft === 'object') {
      fTitle.value = draft.title || '';
      if (writeCats.indexOf(draft.cat) !== -1) fCat.value = draft.cat;
      fAuthor.value = draft.author || '';
      fText.value = draft.text || '';
    }

    function saveDraft() {
      if (editing) return;
      try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify({ title: fTitle.value, cat: fCat.value, author: fAuthor.value, text: fText.value }));
      } catch (e) {}
    }
    [fTitle, fCat, fAuthor, fText].forEach(function (el) {
      el.addEventListener('input', saveDraft);
      el.addEventListener('change', saveDraft);
    });

    function showError(msg, el) {
      err.textContent = msg;
      err.hidden = false;
      if (el) el.focus();
    }
    function setBusy(on) {
      saveBtn.disabled = on;
      saveBtn.textContent = on ? 'جارٍ التجهيز…' : saveLabel;
    }

    saveBtn.addEventListener('click', async function () {
      var title = fTitle.value.trim();
      var paras = parseBody(fText.value);
      if (!title) { showError('اكتب عنوانًا للمقال.', fTitle); return; }
      if (paras.join(' ').length < 30) { showError('النص قصير جدًا. اكتب فقرة واحدة على الأقل.', fText); return; }
      err.hidden = true;

      var author = fAuthor.value.trim();
      var cat = fCat.value;
      var excerpt = makeExcerpt(paras);
      var next, id;
      if (editing) {
        id = editing.id;
        next = posts.map(function (x) {
          return x.id === id ? { id: id, cat: cat, date: x.date, title: title, author: author, excerpt: excerpt, body: paras } : x;
        });
      } else {
        id = 'p' + Date.now().toString(36);
        next = [{ id: id, cat: cat, date: today(), title: title, author: author, excerpt: excerpt, body: paras }].concat(posts);
      }

      setBusy(true);
      try { if (!editing) localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      try {
        await publishPosts(next);
        posts = next;
        location.hash = '#/post/' + encodeURIComponent(id);
      } catch (e) {
        saveDraft();
        var msg = errorMessage(e);
        if (msg) { setBusy(false); showError(msg); }
      }
    });
  }

  /* ---------- routing ---------- */
  function route() {
    var h = location.hash || '#/';
    if (h.indexOf('#/post/') === 0) renderPost(decodeURIComponent(h.slice(7)));
    else if (h.indexOf('#/write/') === 0) renderWrite(decodeURIComponent(h.slice(8)));
    else if (h === '#/write') renderWrite();
    else if (h === '#/about') renderHome('about');
    else if (h === '#/articles') renderHome('articles');
    else renderHome();
  }
  window.addEventListener('hashchange', route);
  route();

  syncNav();

  /* ---------- theme ---------- */
  var root = document.documentElement;
  var btn = document.getElementById('theme-btn');
  function isDark() {
    var t = root.getAttribute('data-theme');
    if (t) return t === 'dark';
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function syncBtn() { btn.textContent = isDark() ? 'الوضع الفاتح' : 'الوضع الداكن'; }
  try {
    var saved = localStorage.getItem('hibr-theme');
    if (saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved);
  } catch (e) {}
  syncBtn();
  btn.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('hibr-theme', next); } catch (e) {}
    syncBtn();
  });
})();
</script>
</body>
</html>
